# Public URL of the NebulaCraft store. No trailing path.
store-url: "https://nebulacraft-store.vercel.app"

# Must match STORE_PLUGIN_SECRET on the website (Vercel). At least 24 characters.
# Do NOT commit the real secret. Set it only in:
#   - Vercel → Environment Variables → STORE_PLUGIN_SECRET
#   - this file on the live Minecraft server (plugins/NebulaStore/config.yml)
#   - local .env.local for store dev
# The plugin will not poll while this is still "change-me".
secret: "change-me"

# How often to ask the store for paid commands.
poll-seconds: 15
